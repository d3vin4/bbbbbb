name: bbbbbb
options:
  bundleIdPrefix: com.d3vin4
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CLANG_ENABLE_OBJC_ARC: true
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: false
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  bbbbbb:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
      - path: BadQuery
    settings:
      base:
        # Identity required by the MHA-C2 direct container workflow
        # (same approach as 3105 / FilzaSlop). The Direct access method
        # degrades to the fallback strategies without it.
        PRODUCT_BUNDLE_IDENTIFIER: com.apple.mobile.MobileHouseArrest
        PRODUCT_NAME: bbbbbb
        INFOPLIST_FILE: App/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: App/bbbbbb-Bridging-Header.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/BadQuery
        CODE_SIGN_ENTITLEMENTS: Entitlements/bbbbbb.entitlements
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: PairingActivity
        embed: true
      - target: PacketTunnel
        embed: true
  PairingActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.apple.mobile.MobileHouseArrest.PairingActivity
        PRODUCT_NAME: PairingActivity
        INFOPLIST_FILE: Widgets/Info.plist
        APPLICATION_EXTENSION_API_ONLY: true
        SKIP_INSTALL: true
  PacketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: Tunnel
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.apple.mobile.MobileHouseArrest.PacketTunnel
        PRODUCT_NAME: PacketTunnel
        INFOPLIST_FILE: Tunnel/Info.plist
        APPLICATION_EXTENSION_API_ONLY: true
        SKIP_INSTALL: true
        CODE_SIGN_ENTITLEMENTS: Entitlements/PacketTunnel.entitlements
schemes:
  bbbbbb:
    build:
      targets:
        bbbbbb: all
        PairingActivity: all
        PacketTunnel: all
    run:
      config: Debug
    archive:
      config: Release
