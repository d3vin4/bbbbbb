name: bbbbbb
options:
  bundleIdPrefix: com.d3vin4
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CLANG_ENABLE_OBJC_ARC: true
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: false
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # Mặc định = identity MHA: hệ thống mới trả ĐÚNG tên + icon app (SPI/LS).
    # Đặt BBBBBB_BUNDLE_ID=com.d3vin4.bbbbbb khi build để cài song song.
    BBBBBB_BUNDLE_ID: com.apple.mobile.MobileHouseArrest
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: "0.9.16"
targets:
  bbbbbb:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: BadQuery
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BBBBBB_BUNDLE_ID)
        PRODUCT_NAME: bbbbbb
        INFOPLIST_FILE: App/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: App/bbbbbb-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/BadQuery
        CODE_SIGN_ENTITLEMENTS: Entitlements/bbbbbb.entitlements
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: ZIPFoundation
schemes:
  bbbbbb:
    build:
      targets:
        bbbbbb: all
    run:
      config: Debug
    archive:
      config: Release
