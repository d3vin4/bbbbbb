name: Build unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain information
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned IPA
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          MARKETING_VERSION: "1.0.0"
        run: bash Scripts/build-ipa.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: bbbbbb-build-${{ github.run_number }}
          path: |
            bbbbbb.ipa
            bbbbbb.ipa.sha256
          retention-days: 90

      - name: Publish GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release delete "$TAG" --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create "$TAG" bbbbbb.ipa bbbbbb.ipa.sha256 \
            --prerelease \
            --title "bbbbbb $TAG (unsigned)" \
            --notes "Unsigned IPA — build #${{ github.run_number }} from commit ${{ github.sha }}. Re-sign before installing (eSign / SideStore / AltStore)."
